name: Desktop installers
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    name: ${{ matrix.platform }} / ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: macos-15, platform: mac, arch: arm64, app: release/desktop/mac-arm64/career.app/Contents/MacOS/career}
          - {os: macos-15-intel, platform: mac, arch: x64, app: release/desktop/mac/career.app/Contents/MacOS/career}
          - {os: windows-latest, platform: win, arch: x64, app: release/desktop/win-unpacked/career.exe}
          - {os: windows-11-arm, platform: win, arch: arm64, app: release/desktop/win-arm64-unpacked/career.exe}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run check:docs
      - name: Build installer (no publishing)
        run: npm run desktop:build -- --platform ${{ matrix.platform }} --arch ${{ matrix.arch }}
      - name: Test the packaged desktop on its native architecture
        run: npm run desktop:test -- --app "${{ matrix.app }}"
      - name: Preserve synthetic smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: career-smoke-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            .cache/desktop-test-*/report.json
            .cache/desktop-test-*/*.png
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: career-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            release/desktop/*.dmg
            release/desktop/*.zip
            release/desktop/*.exe
            release/desktop/SHA256SUMS-*.txt
            release/desktop/SIGNATURES-*.json
          if-no-files-found: error
          retention-days: 14
