<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>开始使用 career</title><style>
:root{color-scheme:light;--ink:#22352d;--green:#3c604b}*{box-sizing:border-box}body{margin:0;background:#f5f6f0;color:var(--ink);font:16px/1.7 system-ui,-apple-system,"Segoe UI",sans-serif}main{max-width:1000px;padding:56px 24px 80px;margin:auto}.brand{font:bold 38px Georgia,serif}.brand span{color:#a2bb79}.top{display:flex;justify-content:space-between;align-items:center}h1{font-size:clamp(28px,5vw,44px);line-height:1.3;margin:48px 0 12px}p{color:#637064;margin:0 0 24px}.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:36px 0}.step{padding:20px;background:#fff;border:1px solid #e0e5da;border-radius:14px}.step b{display:block;margin-bottom:6px}.step small{color:#788472}.card{background:#fff;border:1px solid #dce2d7;border-radius:20px;padding:28px}.bar{display:flex;gap:16px;justify-content:space-between;align-items:center;margin-bottom:20px}.bar b{font-size:20px}button{border:0;border-radius:9px;color:white;background:var(--green);padding:12px 20px;font:inherit;cursor:pointer}button:hover{background:#294b37}button:focus-visible{outline:3px solid #99b873;outline-offset:3px}textarea{width:100%;height:130px;resize:vertical;background:#f7f8f3;border:1px solid #e3e7de;border-radius:10px;padding:18px;font:14px/1.85 system-ui;color:#354e3e}.foot{font-size:13px;margin-top:20px;color:#7b8475}#status{min-height:25px;color:var(--green);margin-top:10px;font-size:14px}@media(max-width:600px){main{padding:28px 18px}.steps{grid-template-columns:1fr;gap:8px}.step{padding:12px 16px}.card{padding:18px}.bar{align-items:flex-start;flex-direction:column}textarea{height:180px}}
</style><main><div class="top"><div class="brand">career<span>.</span></div></div><h1>与 Agent 一起，<br>推进你的下一步。</h1><p>career · 个人求职工作台。初始化你的个人目录，再按工作区指引开始协作。</p><div class="steps"><div class="step"><b>01　确定保存位置</b><small>选定位置后创建 career-workspace 文件夹。</small></div><div class="step"><b>02　初始化个人目录</b><small>安装工具、Skills 和协作入口。</small></div><div class="step"><b>03　打开工作区继续</b><small>新建对话，发送 Agent 给出的开始指令。</small></div></div><div class="card"><div class="bar"><b>发给你的 Agent</b><button id="copy" type="button">复制开始指令</button></div><textarea id="prompt" readonly aria-label="开始指令">请读取 https://raw.githubusercontent.com/heyjianhang/career/main/install.md，按指引帮我安装并初始化 career。</textarea><div id="status" role="status" aria-live="polite"></div></div><div class="foot">把这段发给具备本地文件和终端能力的 Agent。安装完成后，在创建的工作区新建对话继续。</div></main><script>
document.querySelector('#copy').addEventListener('click',async()=>{const input=document.querySelector('#prompt'),status=document.querySelector('#status');try{await navigator.clipboard.writeText(input.value);status.textContent='已复制，可以发给 Agent 了。';}catch{input.focus();input.select();status.textContent='已选中指令，请按 Ctrl+C（Mac 使用 ⌘C）复制。';}});
</script></html>
