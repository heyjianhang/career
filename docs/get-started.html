<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>开始使用 career</title><style>
:root{color-scheme:light;--ink:#22352d;--green:#3c604b}*{box-sizing:border-box}body{margin:0;background:#f5f6f0;color:var(--ink);font:16px/1.7 system-ui,-apple-system,"Segoe UI",sans-serif}main{max-width:1000px;padding:56px 24px 80px;margin:auto}.brand{font:bold 38px Georgia,serif}.brand span{color:#a2bb79}.top{display:flex;justify-content:space-between;align-items:center}h1{font-size:clamp(28px,5vw,44px);line-height:1.3;margin:48px 0 12px}p{color:#637064;margin:0 0 24px}.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:36px 0}.step{padding:20px;background:#fff;border:1px solid #e0e5da;border-radius:14px}.step b{display:block;margin-bottom:6px}.step small{color:#788472}.card{background:#fff;border:1px solid #dce2d7;border-radius:20px;padding:28px}.bar{display:flex;gap:16px;justify-content:space-between;align-items:center;margin-bottom:20px}.bar b{font-size:20px}button{border:0;border-radius:9px;color:white;background:var(--green);padding:12px 20px;font:inherit;cursor:pointer}button:hover{background:#294b37}button:focus-visible{outline:3px solid #99b873;outline-offset:3px}textarea{width:100%;height:260px;resize:vertical;background:#f7f8f3;border:1px solid #e3e7de;border-radius:10px;padding:18px;font:14px/1.85 system-ui;color:#354e3e}.foot{font-size:13px;margin-top:20px;color:#7b8475}#status{min-height:25px;color:var(--green);margin-top:10px;font-size:14px}@media(max-width:600px){main{padding:28px 18px}.steps{grid-template-columns:1fr;gap:8px}.step{padding:12px 16px}.card{padding:18px}.bar{align-items:flex-start;flex-direction:column}textarea{height:340px}}
</style><main><div class="top"><div class="brand">career<span>.</span></div></div><h1>与 Agent 一起，<br>推进你的下一步。</h1><p>career · 个人求职工作台。初始化你的个人目录，再按工作区指引开始协作。</p><div class="steps"><div class="step"><b>01　检查运行环境</b><small>由 Agent 准备 Node.js 和 npm。</small></div><div class="step"><b>02　初始化个人目录</b><small>安装工具、Skills 和协作入口。</small></div><div class="step"><b>03　读取工作区指引</b><small>后续步骤都在 AGENTS.md 中。</small></div></div><div class="card"><div class="bar"><b>发给你的 Agent</b><button id="copy" type="button">复制开始指令</button></div><textarea id="prompt" readonly aria-label="开始指令">请帮我安装 career，并初始化一个独立的个人求职工作区。
先检查 Node.js 22+ 和 npm，缺少时从官方来源安装。和我确定资料目录后，用绝对路径执行：
npx --yes --package @heyjianhang/career@0.2.0 career setup --workspace "&lt;个人目录&gt;" --json

完成后进入这个目录，先读取 AGENTS.md，再按初始化结果的 next_reads 和 next_action 继续引导我。</textarea><div id="status" role="status" aria-live="polite"></div></div><div class="foot">把这段发给具备本地文件和终端能力的 Agent。初始化完成后，它会按工作区指引继续协作。</div></main><script>
document.querySelector('#copy').addEventListener('click',async()=>{const input=document.querySelector('#prompt'),status=document.querySelector('#status');try{await navigator.clipboard.writeText(input.value);status.textContent='已复制，可以发给 Agent 了。';}catch{input.focus();input.select();status.textContent='已选中指令，请按 Ctrl+C（Mac 使用 ⌘C）复制。';}});
</script></html>
