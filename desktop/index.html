<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; base-uri 'none'; form-action 'none'"><title>career</title><link rel="icon" href="icon.svg"><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="updates.css"></head>
<body><main class="welcome-shell">
<header><div class="brand" aria-label="career">career<span>.</span></div></header>
<section id="start" aria-labelledby="start-title">
<h1 id="start-title" tabindex="-1">打开工作区</h1><p class="intro">岗位、简历和经历，保存在自己的文件夹里。</p>
<section id="recent-section" aria-labelledby="recent-title" hidden><h2 id="recent-title">最近使用</h2><div id="recent"></div></section>
<div class="entry-actions"><button id="new" class="primary"><span aria-hidden="true">＋</span> 新建工作区</button><button id="open">打开已有文件夹</button></div><button id="restore" class="text">从 Git 仓库恢复 →</button><p id="sync-hint" class="path"></p>
</section>
<section id="create" aria-labelledby="create-title" hidden>
<div class="step-heading"><button id="create-back" class="icon-button" aria-label="返回工作区列表"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 5-7 7 7 7M5 12h14"/></svg></button><h1 id="create-title" tabindex="-1">新建工作区</h1></div>
<div id="restore-environment" hidden></div><form id="create-form"><div id="repository-field" hidden><label for="repository">GitHub 私人仓库地址</label><input id="repository" placeholder="https://github.com/你/私人仓库" autocomplete="off"><p class="path">已有资料会恢复到新文件夹；空仓库会创建新的工作区。</p></div><label for="name">名称</label><input id="name" value="我的求职" maxlength="60" required autocomplete="off">
<label for="parent">保存位置</label><div class="location"><input id="parent" required autocomplete="off"><button type="button" id="choose">选择…</button></div>
<p id="destination" class="path destination"></p><div class="form-actions"><button class="primary" id="create-submit" type="submit">创建并继续 <span aria-hidden="true">→</span></button></div></form>
</section>
<section id="ready" aria-labelledby="ready-title" hidden>
<h1 id="ready-title" tabindex="-1">工作区已准备好</h1>
<div class="workspace-summary"><div><strong id="workspace-title"></strong><p id="workspace-path" class="path"></p></div><button id="reveal" class="text">打开文件夹</button></div>
<p class="handoff-intro">在 Agent 软件中打开这个文件夹，新建对话并粘贴指令，即可开始整理资料。</p>
<button id="copy" class="primary full-width">复制给 Agent</button>
<details class="prompt-details"><summary>查看指令</summary><textarea id="prompt" aria-label="给 Agent 的指令" readonly rows="5"></textarea></details>
<div class="ready-footer"><button id="back" class="text">返回列表</button><button id="enter" class="text">进入工作台 <span aria-hidden="true">→</span></button></div>
</section>
<p id="error" role="alert" hidden></p><p id="status" role="status" aria-live="polite"></p><footer><button id="open-updates" class="text welcome-updates">关于与更新</button><span id="version"></span></footer>
</main><script type="module" src="app.js"></script></body></html>
